# API image: java by default. Any implemented server works: SERVER=go docker compose up --build
services:
  api:
    build: ./server/${SERVER:-java}
    environment:
      SERVER_PORT: "8080"
      DEMO_DELAY_MS: "300"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/hello/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
