packages:
  - "packages/*"
  - "apps/*"
  - "extensions/*"
  - "www"
  - "conformance"

catalog:
  typescript: "6.0.3"
  eslint: "10.15.0"
  "@eslint/js": "10.0.1"
  typescript-eslint: "8.73.0"
  eslint-plugin-react-hooks: "7.1.1"
  prettier: "3.10.1"
  vite: "8.3.8"
  "@vitejs/plugin-react": "6.3.0"
  vitest: "5.1.1"
  react: "19.3.1"
  react-dom: "18.3.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "18.3.7"
  jsdom: "31.0.1"
  "@testing-library/react": "16.3.3"
  "@testing-library/jest-dom": "7.0.1"
  msw: "2.15.0"
  "@types/vscode": "1.90.0"
  esbuild: "0.28.2"

allowBuilds:
  msw: false
  esbuild: true

minimumReleaseAgeExclude:
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - vitest@5.1.1
