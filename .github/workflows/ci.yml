name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter jsctrls-designer build
      - run: pnpm --filter www build

  api:
    name: API (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # setup-java caches ~/.m2/repository but not the Maven the wrapper downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('server/java/.mvn/wrapper/maven-wrapper.properties') }}
      # Fetch Maven with retries, so a flaky download does not fail the build.
      - run: for i in 1 2 3; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1
      - run: ./mvnw -B test

  dotnet:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/dotnet/global.json
      - run: dotnet test --nologo
