version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /server/java
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /server/dotnet
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
